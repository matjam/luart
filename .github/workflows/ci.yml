name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: vet
        run: go vet -unreachable=false ./...
      - name: test
        run: go test ./...
      - name: race
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: bench smoke
        working-directory: bench
        run: go test -run x -bench . -benchtime 1x ./...
